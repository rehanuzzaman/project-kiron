<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="radarScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C52FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#8C52FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8C52FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="480" fill="url(#skyGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Physical Feature Silhouette: River & Landforms -->
  <path d="M 0 340 Q 200 310 400 350 T 800 320 L 800 480 L 0 480 Z" fill="#0a192f" />
  <path d="M 0 370 Q 240 330 460 380 T 800 360 L 800 480 L 0 480 Z" fill="#3B82F6" opacity="0.65" />
  
  <!-- Radar Wave arcs -->
  <g stroke="#8C52FF" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="80" r="120" />
    <circle cx="400" cy="80" r="220" stroke-dasharray="4 6" />
    <circle cx="400" cy="80" r="320" />
  </g>

  <!-- Horizon features / Trees / Dikes -->
  <path d="M 40 340 L 90 315 L 140 340 L 190 320 L 250 345 L 320 310 L 380 340" stroke="#EF4444" stroke-width="3" fill="none" opacity="0.8" />
  <circle cx="90" cy="315" r="5" fill="#EF4444" filter="url(#glow)" />
  <circle cx="190" cy="320" r="5" fill="#EF4444" />
  <circle cx="320" cy="310" r="6" fill="#8C52FF" filter="url(#glow)" />

  <!-- Badge Pill -->
  <rect x="36" y="32" width="340" height="32" rx="16" fill="rgba(11,15,25,0.85)" stroke="#8C52FF" stroke-width="1.2" />
  <circle cx="54" cy="48" r="5" fill="#8C52FF" filter="url(#glow)" />
  <text x="68" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
    SURGE INUNDATION: 24 ppt Salinity
  </text>

  <!-- Title & Narrative Box -->
  <rect x="36" y="370" width="728" height="85" rx="12" fill="rgba(11, 15, 25, 0.88)" stroke="rgba(255,255,255,0.12)" />
  <text x="56" y="402" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">
    Burigoalini Polder 5 Embankment Rupture
  </text>
  <text x="56" y="425" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    Tidal surge tearing through earthen dike into village homes
  </text>
  <text x="56" y="442" fill="#8C52FF" font-family="monospace" font-size="11">
    COORDINATES: 22.2885° N, 89.1362° E | NISAR L+S BAND OBSERVATION
  </text>

  <!-- Satellite Sensor Symbol -->
  <g transform="translate(710, 40)">
    <rect x="-18" y="-10" width="36" height="20" rx="3" fill="#334155" stroke="#8C52FF" stroke-width="1.5" />
    <line x1="-36" y1="0" x2="-18" y2="0" stroke="#8C52FF" stroke-width="2" />
    <line x1="18" y1="0" x2="36" y2="0" stroke="#8C52FF" stroke-width="2" />
    <rect x="-48" y="-8" width="12" height="16" fill="#0EA5E9" opacity="0.8" />
    <rect x="36" y="-8" width="12" height="16" fill="#0EA5E9" opacity="0.8" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>